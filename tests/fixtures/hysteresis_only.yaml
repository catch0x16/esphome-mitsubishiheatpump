esphome:
  name: hysteresis-only

host:

logger:

external_components:
  - source: ../../components

demo:
  climates:
    - id: inner
      name: "Inner"
      type: 1

sensor:
  - platform: template
    id: room_temperature
    update_interval: 10s
    lambda: return 20.0;

climate:
  - platform: workflow_climate
    name: "Hysteresis Outer"
    climate_id: inner
    temperature_sensor: room_temperature
    hysteresis:
      on_threshold: 0.25
      off_threshold: 0.25
      min_cycle_duration: 60s

