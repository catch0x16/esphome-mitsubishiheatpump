esphome:
  name: pid-only

host:

logger:

external_components:
  - source: ../../components

demo:
  climates:
    - id: inner
      name: "Inner"
      type: 1

sensor:
  - platform: template
    id: room_temperature
    update_interval: 10s
    lambda: return 20.0;

climate:
  - platform: workflow_climate
    name: "PID Outer"
    climate_id: inner
    temperature_sensor: room_temperature
    pid:
      kp: 1.0
      ki: 0.1
      kd: 0.01

